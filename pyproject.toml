[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-strategic-briefing"
version = "1.0.0"
description = "Autonomous analytics pipeline: CSV → statistical analysis → anomaly detection → forecast → AI narrative → HTML report"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "anthropic>=0.40",
]

[project.scripts]
briefing = "src.cli.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
